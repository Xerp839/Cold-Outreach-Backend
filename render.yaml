services:
  - type: web
    name: cold-outreach-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CANDIDATE_NAME
        sync: false
      - key: CANDIDATE_PHONE
        sync: false
      - key: CANDIDATE_LINKEDIN
        sync: false
      - key: CANDIDATE_PORTFOLIO
        sync: false
      - key: RESUME_URL
        sync: false
      - key: CANDIDATE_CURRENT_COMPANY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: COMPANY_BLOCKLIST
        sync: false
